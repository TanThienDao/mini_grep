name: Build
on:
  push:
    branches:
      ["main", "master"]
  pull_request:
    branches:
      ["main", "master"]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: actions/setup-rust@v1.7.2
        with:
          rust-version: stable
      - name: Build
        run: cargo build --verbose