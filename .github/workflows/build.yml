name: Build
on:
  push:
    branches:
      ["main", "master"]
  pull_request:
    branches:
      ["main", "master"]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rust-version: stable
      - name: Build Project
        run: cargo build --verbose
      - name: Run Tests
        run: cargo test --verbose
